<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>GiftVault</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="styles.css">
</head>

<body>

  <header>
        <h1><img class="gv-logo" src="logo.svg" alt="GiftVault"></h1>
    <div class="balance"><span data-ico="gem"></span><span id="balanceVal">0.0</span></div>
  </header>

  <!-- ========== MARKET ========== -->
  <section class="view active" id="view-market">
    <div class="featured" id="featured"></div>
    <input class="search" id="search" placeholder="Search gifts...">

    <div class="chips">
      <button class="chip active" data-tab="all"><span data-ico="paw"></span>Animals</button>
      <button class="chip" data-tab="fav"><span data-ico="heart"></span>Favorites</button>
      <button class="chip locked"><span data-ico="lock"></span>Fruits</button>
      <button class="chip locked"><span data-ico="lock"></span>Cali Chill</button>
    </div>

    <div id="grid"></div>

    <button class="filter-btn" id="openFilter"><span data-ico="filter"></span>Filter</button>
  </section>

  <!-- ========== INVENTORY ========== -->
  <section class="view" id="view-inventory">
    <div class="panel stat-bar" id="invStats"></div>
    <div id="invGrid"></div>
  </section>

  <!-- ========== UPGRADE ========== -->
  <section class="view" id="view-upgrade">
    <div id="upgradeBox"></div>
  </section>

  <!-- ========== PROFILE ========== -->
  <section class="view" id="view-profile">
    <div id="profileBox"></div>
  </section>

  <!-- sort sheet (market) -->
  <div id="sheet">
    <h2>Sort by</h2>
    <button class="opt active" data-sort="default">Default</button>
    <button class="opt" data-sort="low">Price: low to high</button>
    <button class="opt" data-sort="high">Price: high to low</button>
  </div>

  <!-- upgrade reveal -->
  <div class="reveal" id="reveal">
    <div class="reveal-flash"></div>
    <div class="reveal-inner">
      <div class="reveal-art" id="revArt"></div>
      <div class="reveal-rarity" id="revRarity"></div>
      <div class="reveal-name" id="revName"></div>
      <div class="reveal-value" id="revValue"></div>
      <button class="big-btn" id="revClose">Nice!</button>
    </div>
  </div>
  <div class="detail" id="detail">
    <div class="detail-inner" id="detailBody"></div>
  </div>

  <!-- bottom nav -->
  <nav>
    <div class="tab active" data-view="market"><span data-ico="market"></span>Market</div>
    <div class="tab" data-view="inventory"><span data-ico="inventory"></span>Inventory</div>
    <div class="tab" data-view="upgrade"><span data-ico="upgrade"></span>Upgrade</div>
    <div class="tab" data-view="profile"><span data-ico="profile"></span>Profile</div>
  </nav>

  <script src="script.js"></script>
</body>
</html>
