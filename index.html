<!DOCTYPE html>
<html lang="en">
<head>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>GiftVault</title>
  <link rel="stylesheet" href="styles.css">
    
</head>

<body>

  <header>
    <h1>🎁 GiftVault</h1>
    <div class="balance" id="userName">💎 0.0 TON</div>
  </header>

  <input class="search" id="search" placeholder="Search gifts...">

  <div class="chips">
    <button class="chip active" data-tab="all">All</button>
    <button class="chip" data-tab="fav">Favorites</button>
  </div>

  <div id="grid"></div>

  <button class="filter-btn" id="openFilter">☰ Filter</button>

  <div id="sheet">
    <h2>Sort by</h2>
    <button class="opt active" data-sort="default">Default</button>
    <button class="opt" data-sort="low">Price: low to high</button>
    <button class="opt" data-sort="high">Price: high to low</button>
  </div>

  <nav>
    <div class="active"><span>🛒</span>Market</div>
    <div><span>🎒</span>Inventory</div>
    <div><span>⚡</span>Upgrade</div>
    <div><span>👤</span>Profile</div>
  </nav>

  <script src="script.js"></script>

</body>
</html>
