<!DOCTYPE html>
<html lang="en">
<head>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>GiftVault</title>

  <style>
    /* ---------- BASE ---------- */
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    :root {
      --bg: #0f0f12;
      --card: #1b1b21;
      --text: #ffffff;
      --muted: #8a8a96;
      --blue: #2a8cff;
      --pink: #ff4d8d;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
      padding-bottom: 90px;
      max-width: 480px;
      margin: 0 auto;
    }

    /* ---------- HEADER ---------- */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 14px 8px;
    }
    header h1 { font-size: 22px; }
    .balance {
      background: var(--card);
      padding: 8px 14px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 600;
    }

    /* ---------- SEARCH + CHIPS ---------- */
    .search {
      width: calc(100% - 28px);
      margin: 6px 14px;
      padding: 12px 16px;
      background: var(--card);
      border: none;
      border-radius: 14px;
      color: var(--text);
      font-size: 15px;
      outline: none;
    }

    .chips { display: flex; gap: 8px; padding: 6px 14px 12px; }
    .chip {
      background: var(--card);
      color: var(--muted);
      border: none;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 14px;
      cursor: pointer;
    }
    .chip.active { background: var(--blue); color: white; }

    /* ---------- GRID + CARDS ---------- */
    #grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      padding: 0 14px;
    }

    .card {
      border-radius: 20px;
      padding: 10px;
      text-align: center;
      position: relative;
    }

    .serial {
      position: absolute;
      top: 10px;
      left: 12px;
      font-size: 11px;
      background: rgba(0,0,0,0.35);
      padding: 3px 8px;
      border-radius: 10px;
    }

    .art {
      font-size: 64px;
      height: 110px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card h3 { font-size: 16px; margin: 4px 0 10px; color: #111; }

    .row { display: flex; gap: 6px; }
    .price {
      flex: 1;
      background: var(--blue);
      border: none;
      color: white;
      padding: 10px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }
    .price:active { transform: scale(0.96); }

    .heart {
      width: 40px;
      background: rgba(0,0,0,0.65);
      border: none;
      border-radius: 50%;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }
    .heart.on { color: var(--pink); }

    .empty { grid-column: 1 / -1; text-align: center; color: var(--muted); padding: 40px 0; }

    /* ---------- FLOATING FILTER BUTTON ---------- */
    .filter-btn {
      position: fixed;
      bottom: 80px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(30,30,36,0.95);
      color: white;
      border: none;
      padding: 12px 22px;
      border-radius: 24px;
      font-size: 15px;
      font-weight: 600;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
      cursor: pointer;
    }

    /* ---------- FILTER SHEET ---------- */
    #sheet {
      position: fixed;
      left: 0; right: 0; bottom: 0;
      max-width: 480px;
      margin: 0 auto;
      background: var(--card);
      border-radius: 24px 24px 0 0;
      padding: 20px 16px 30px;
      transform: translateY(100%);
      transition: transform 0.25s ease;
      z-index: 20;
    }
    #sheet.open { transform: translateY(0); }
    #sheet h2 { font-size: 18px; margin-bottom: 14px; }
    .opt {
      display: block;
      width: 100%;
      background: #26262e;
      color: white;
      border: none;
      padding: 14px;
      border-radius: 12px;
      margin-bottom: 8px;
      font-size: 15px;
      text-align: left;
      cursor: pointer;
    }
    .opt.active { background: var(--blue); }

    /* ---------- BOTTOM NAV ---------- */
    nav {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      max-width: 480px;
      margin: 0 auto;
      display: flex;
      background: #15151a;
      border-top: 1px solid #25252d;
      padding: 8px 0 14px;
    }
    nav div { flex: 1; text-align: center; font-size: 11px; color: var(--muted); }
    nav div span { display: block; font-size: 20px; }
    nav div.active { color: var(--blue); }
  </style>
</head>

<body>

  <header>
    <h1>🎁 GiftVault</h1>
    <div class="balance" id="userName">💎 0.0 TON</div>
  </header>

  <input class="search" id="search" placeholder="Search gifts...">

  <div class="chips">
    <button class="chip active" data-tab="all">All</button>
    <button class="chip" data-tab="fav">Favorites</button>
  </div>

  <div id="grid"></div>

  <button class="filter-btn" id="openFilter">☰ Filter</button>

  <div id="sheet">
    <h2>Sort by</h2>
    <button class="opt active" data-sort="default">Default</button>
    <button class="opt" data-sort="low">Price: low to high</button>
    <button class="opt" data-sort="high">Price: high to low</button>
  </div>

  <nav>
    <div class="active"><span>🛒</span>Market</div>
    <div><span>🎒</span>Inventory</div>
    <div><span>⚡</span>Upgrade</div>
    <div><span>👤</span>Profile</div>
  </nav>

  <script src="script.js"></script>

</body>
</html>
